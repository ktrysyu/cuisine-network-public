  - id: R-P05
    op: heat
    applies_to: chicken / beef
    condition: 安全上の最低中心温度
    effect: 状態変化ではなく制約。鶏肉 165°F（74℃）、牛ステーキ 145°F（63℃）＋3分休ませる、牛ひき肉 160°F（71℃）
    values: "poultry 165°F / steaks, chops, roasts 145°F + rest 3 minutes / ground beef 160°F"
    source: fsis
    check: 抜粋のみ
    confidence: 高
    note: 公的機関の基準。℃は換算（出典の本文は 403 で取得できず）
  - id: R-P06
    op: heat
    applies_to: beef
    condition: 50・60・70・80℃に保つ（中心がその温度になってから 30 分）
    effect: 加熱損失（失う重さの割合）は到達温度とともに増える。50℃ 7〜11%、60℃ 17〜21%、70℃ 29〜32%、80℃ 34〜40%
    values: "The cooking loss gradually increased with the increase in temperature, and it ranged between 7% and 11% at 50 °C, between 17% and 21% at 60 °C, and between 29 and 32% at 70 °C"
    source: vaskoska2020
    check: 本文確認
    confidence: 中
    note: 2026-10-22 追加（通説3 焼き目と肉汁）。30 分保った後の値で、短い加熱で失う速さは分からない。80℃ の 34〜40% は同じ論文の筋肉ごとの値（半腱様筋 40・大腿二頭筋 38・大腰筋 34）
  - id: R-P07
    op: heat
    applies_to: chicken
    condition: 中心が 136〜165°F（57.8〜73.9℃）に保たれる
    effect: 保つ時間が足りるとサルモネラが 7 桁（1000万分の1）に減る。温度が低いほど長く要る（140°F 60℃で 25.7分、145°F 62.8℃で 8.6分、150°F 65.6℃で 2.7分、165°F 73.9℃で 10秒未満。鶏・脂肪 2%）
    values: "Times for a given temperature, fat content, and species needed to obtain a 7-log10 lethality of Salmonella ... Fat % = 2 ... 140 25.7 min ... 165 <10 sec"
    source: fsis_poultry_tables
    check: 本文確認
    confidence: 高
    note: 2026-10-22 追加（通説11 鶏むね肉を低温で）。公的機関の表の写し。表の温度の間は時間の対数で直線補間し、温度が変わる間は「その温度で要る時間」に対する割合を足し合わせる（通説ページの計算での扱い、推定）。R-P05 の 74℃ は、この表で 10 秒未満になる温度

  # ---- 水・加熱媒体 ----
  - id: R-W04
    op: simmer
    applies_to: water + salt
    condition: 水に食塩を溶かす
    effect: 沸点が上がる。上がり幅 ΔTb = Kb × m × i（m は水 1 kg あたりの溶けた物質の量 mol、食塩は Na⁺ と Cl⁻ に分かれるので i ≒ 2）
    values: "the value of Kb is 0.512°C/m ... over 100 grams of NaCl to a liter of water to increase the boiling point by a couple of degrees"
    source: libretexts_bpe
    check: 本文確認
    confidence: 高
    note: 2026-10-22 追加（通説5 塩と沸点）。i = 2 は完全に分かれたときの理想の値で、実際は少し小さい（推定、出典は今回確かめていない）。シミュレータの沸点（R-W01・糖液の表）にはまだ入れていない
  - id: R-W01
    op: [simmer, steam]
    applies_to: 水・蒸気
    condition: 大気圧
    effect: 媒体の温度は100℃が上限
    values: 物理定数
    source: mc_maillard
    check: 本文確認
    confidence: 高
  - id: R-W02
    op: heat
    applies_to: 湿った食品
    condition: 表面に水がある間
    effect: T_surface_max は沸点を超えない。高温の乾いた加熱（焼く・揚げる）で表面が乾いてはじめて100℃を超える
    values: "only high-heat cooking techniques can dry out the food enough to raise the temperature sufficiently"
    source: mc_maillard
    check: 本文確認
    confidence: 高
    note: 焼く・蒸す・煮る・揚げるを1つの「加熱」にまとめる根拠
  - id: R-W03
    op: steam
    applies_to: 蒸し器
    condition: 蓋をずらす・火を弱める
    effect: 庫内を 85〜90℃ に下げられる
    values: "蒸し器内の温度を85～90℃に保ち"
    source: chawan_web
    check: 抜粋のみ
    confidence: 中

  # ---- 酸 ----
  - id: R-A01
    op: mix
    applies_to: vinegar / lemon_juice
    condition: 加える
    effect: pH ↓（酢 約2.4〜3.0、レモン汁 約2.0〜2.6）
    values: null
    source: null
    check: 未確認
    confidence: 低
    note: pH の値は推定。成分表には pH がない。R-D01・R-E14・R-E18・R-M03 に効く

# ---------------------------------------------------------------
# 目標料理の完成時の状態
# 各値に basis（規則ID／推定／料理の定義）を付ける
# process_ref は状態を書くための参考手順（入力ではない）
# ---------------------------------------------------------------
targets:
  scrambled_eggs:
    ja: スクランブルエッグ
    ingredients: [egg_whole, milk（任意）, butter, salt]
    process_ref: 卵＋牛乳を混ぜる → フライパン（バター）で加熱しながら撹拌
    state:
      T_core_max: {value: "70〜75℃", basis: "R-E07 と omelet_web（衝突 C2）"}
      egg_gel_stage: {value: "1〜2（とろみ〜やわらかいゲル）", basis: R-E07}
      gel_structure: {value: 小片（カード）, basis: "R-E20（推定）"}
      egg_white_stage: {value: 2, basis: "R-E02（65℃で やわらかい固体、80℃未満）"}
      egg_yolk_stage: {value: "1〜2", basis: R-E05}
      water: {value: "約75 g/100g（全卵の値からほぼ減らない）", basis: 推定}
      fat_phase: {value: 液体（バター融解）, basis: R-D05}
      maillard: {value: 0, basis: "料理の定義（焼き色を付けない流儀）。付ける流儀もある（衝突 C9）"}
      porosity: {value: 0, basis: 推定}
  omelet:
    ja: オムレツ（プレーン）
    ingredients: [egg_whole, butter, salt]
