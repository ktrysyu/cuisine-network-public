# ---------------------------------------------------------------
# 衝突・未確定
# ---------------------------------------------------------------
conflicts:
  C1: 卵白の凝固開始温度が出典によって 55〜57℃（kajiya）／60℃（SoC）／62℃（検索抜粋）／63℃（SoC のとろみ開始）とばらつく。何をもって「凝固開始」とするか（特定のたんぱく質・白濁・とろみ）が違う
  C2: 撹拌した全卵の凝固が 73℃（SoC）と「70℃開始・75℃でしっかり」（家庭向けサイト）で違う。プリン液について「70℃開始・75℃」とする記事（mirai、出典なし）は、カスタードの 80〜85℃（R-E09）と矛盾する。希釈・砂糖を考えると後者が正しいと思われるが、一次資料では確認していない
  C3: 牛乳・砂糖で薄めると凝固温度が上がる（R-E09, R-E10）ことは確かだが、薄め方ごとの凝固温度の関数（何%で何℃）は見つけていない。プリン・茶碗蒸しの状態は類推で書いた
  C4: ショ糖のカラメル化 160℃（SoC）と 170℃（McGee）。さらにショ糖は熱分解なので時間をかければ低温でも進む（R-C03, R-C04）。「しきい値」でモデル化すると両方と食い違う
  C5: 食塩は卵の凝固力を上げるが凝固温度も上げる（R-E12, R-E13、同じ論文）。「塩は卵を固まりやすくする」という一般的な言い方とは、指標によって合ったり合わなかったりする
  C6: 米でんぷんの糊化開始が 60℃付近（農水省）と 58.9〜82℃（論文、幅）で違う。米の品種と測定法による
  C7: 炒め玉ねぎの褐変のうちメイラードとカラメル化がどれだけずつかは分からない。「玉ねぎのカラメリゼ」という呼び名は化学的には不正確かもしれないが、確かめていない
  C8: メイラードを 140℃しきい値で持つか、温度依存の速度で持つか。煮込み・長時間加熱では 140℃未満でも色が付く（R-M04）
  C9: 料理の定義そのものが流儀で分かれる。スクランブルエッグ（焼き色の有無・仕上げ温度）、オムレツ（焼き色）。目標状態は1点ではなく範囲で持つ必要がある
  C10: 鶏むね肉は安全基準 74℃ と乾きはじめ 70℃ が近い。安全を制約にすると「しっとり」は低温長時間（時間で殺菌）でしか満たせず、到達温度だけの状態では表せない
  C11: 状態変数の多くが段階（ordinal）で、段階と温度の対応は出典にあるが段階の間の連続量はない。最近傍の料理を探すときの距離の定義が未定
  C12: 卵白:卵黄の質量比、酢・レモン汁の pH、乳清の変性温度、泡のオーバーラン、肉の水分流出量は数値を集めていない（推定か空欄）
  C13: ポーチドエッグの湯温が出典によって 62℃（wiki_poached）／63–65℃（terumimorita の要約行）／71〜74℃を保つ・85℃で入れる（travelingfoodlab）／80℃（soc_poach）／80–85℃（terumimorita 本文）／沸騰（kyounoryouri）とばらつく。シミュレータは 100℃ で頭打ちで、「弱い沸騰」と「激しい沸騰」を区別できない
  C14: 湯に酢・塩を入れるかが出典で分かれる。入れる（kyounoryouri・terumimorita。すばやく固まり散らない）／入れない（travelingfoodlab。表面に不規則な膜ができる、McGee）。効果の向き（凝固が速まる）は両者で一致し、仕上がりの評価が違う
  C15: 殻付き卵の温度を2つの一次遅れ（中心 tau 7.2分・卵白の層 tau 1.4分）で持つ。どちらも球の熱伝導（tatsu2019 に合わせた）の近似で、中心の一次遅れは球の解より立ち上がりが速い（沸騰の湯で中心が 63.2% に達するのは 一次遅れ 7.2分・球 10.3分）。卵白の層の tau は「63.2% に達する時間」で決めたが、75%・98% で決めると 1.9分・4.3分になる（2026-09-28、修正 B）。2026-09-28 夜 Q6 (a) で、殻付き卵は2つの一次遅れをやめて球の熱伝導の解そのもの（R²/α=60.5分）に置き換えた。残る近似は 卵黄と卵白の熱拡散率の違い・卵の形・殻の熱抵抗を分けていない。2026-09-28 夜（余熱）から、取り出した後も同じ解を続ける（空気はロバン条件 Bi_air=0.5、推定。水・蒸気・冷水は表面＝媒体温度）
  C16: 余熱を表せるのは殻付き卵だけ（球の熱伝導の解）。ほかの形（割った卵・溶き卵・器の卵液・肉）は1つの温度の一次遅れで、中心が周りの温度を越えないので余熱が出ない。またレシピに後の手順が書いていないときは「室温に置く」とみなした（2026-09-28 夜、rules.md §10）。世の中の半熟ゆで卵のレシピ（書いていない 3 行）はこれで該当なしになり、「すぐ氷水」なら半熟。実際に食べるまでの時間の出典はない

# ---------------------------------------------------------------
# シミュレータの採用値（2026-09-27 追加）
# 方針: 反応は「しきい値の温度＋温度履歴（温度帯ごとの保持時間）」で扱う。反応速度論は使わない。
# 出典で値が食い違うものは value に採用値を1つ置き、alternatives に代替値を併記する。
# check が「推定」のものは出典がなく、シミュレータを動かすために置いた値。
# 温度の追従（中心・表面が媒体の温度に近づく）はニュートンの冷却則（熱伝達）で近似する。
# これは反応ではなく熱の移動の近似で、時定数 tau は R-E08・R-S04 から逆算した2つ以外は推定。
# ---------------------------------------------------------------
sim:
  run:
    dt_min: {value: 0.1, unit: min, check: 推定, why: 時間刻み。しきい値と保持時間の判定の分解能}
    T0_default: {value: 20, unit: ℃, check: 推定, why: 食材の初期温度（室温）。レシピで上書きできる}
    boiling_point_water: {value: 100, unit: ℃, rule: R-W01, check: 本文確認}
    mix_temperature: {value: 質量加重平均, check: 推定, why: 比熱をすべて等しいとみなす}

  added_state_variables:   # state_variables に無く、シミュレータで足したもの（rules.md §10）
    egg_form: {ja: 卵の形, type: categorical, levels: [殻付き, 割った, 溶き卵]}
    egg_gel_stage_surface: {ja: 卵液の外側のゲル段階, type: ordinal, levels: 同 egg_gel_stage}
    T_whisk: {ja: 泡立て中の品温（平均）, unit: ℃, type: continuous}
    air: {ja: 気泡の有無, type: bool, note: air_frac の数値がないため真偽で持つ。foam_stage ≧ 1 か co2 ≧ 2}
    sugar_conc_ratio: {ja: 重量あたりの糖濃度の倍率（水が飛ぶ前との比）, type: continuous}
    meat_water_loss: {ja: 肉からの水分流出（段階に変更）, type: ordinal, levels: {0: なし, 1: 肉汁が出る（60℃）, 2: むね肉が乾く（70℃）}}
    egg_white_cohesion: {ja: 卵白のまとまり（割って湯に落とした卵）, type: categorical, levels: [ばらける, まとまる（表面に膜・ちぎれ）, まとまる], rule: "R-E21, R-E22", note: 湯に落とした時点の湯温と酢・塩で決める。湯に落としていない卵では値なし}

  heat_transfer:
    tau_min:   # 中心温度が媒体温度に近づく時定数（形ごと）
      thin:  {value: 2.0, check: 推定, why: フライパンに広げた卵液・生地・薄切り}
      cup:   {value: 5.0, check: 推定, why: 型・器に入れた卵液（プリン・茶碗蒸し）}
      shell: {value: 7.2, unused_since: "2026-09-28 夜（egg_sphere に置き換え）", rule: R-E08, check: 抄録確認, why: "殻付き卵で中心が湯温近く（1℃以内）に達するまで約28分。20℃から68℃として 28/ln(48/1) ≈ 7.2"}
      pot:   {value: 3.3, rule: R-S04, check: 本文確認, why: "炊飯の温度上昇期 約10分 を 3τ とみなした"}
      piece: {value: 4.0, check: 推定, why: 厚さ2cm程度の肉片}
      drop:  {value: 7.2, check: 推定, why: "割って湯に落とした卵（ポーチドエッグ）。質量は殻付き卵と同じで殻の熱抵抗は小さいとみなし、shell と同じ値にした"}
    tau_white_layer_min: {value: 1.4, unused_since: "2026-09-28 夜（egg_sphere に置き換え）", unit: min, rule: R-E08, source: "tatsu2019・egg_structure", check: 推定, conflict: C15, alternatives: ["1.9（75% に達する時間で決めた場合）", "4.3（98%。中心の tau と同じ決め方）"], why: "殻付き卵の卵白の層（体積平均）の温度が媒体温度に近づく時定数（2026-09-28、修正 B）。卵を一様な球とみなし、球の熱伝導の解（表面＝媒体温度）で中心が 20→68℃の湯で 1℃以内に達するのが 28分（tatsu2019、shell の tau と同じ根拠）になるよう R²/α=60.5分 と決め、卵黄を中心の球（中身の 34%、egg_structure の 卵黄 30〜33%／卵白 56〜59% から）、卵白をその外側の層として、卵白の層の体積平均が 63.2% に達する時間 1.42分 を採った。殻の熱抵抗は分けていない（tatsu2019 の実測に含まれる。殻 0.2〜0.38mm）。R²/α=60.5分 は熱拡散率 1.7×10⁻⁷ m²/s（egg_thermal）なら半径 2.5cm に当たり、卵の大きさと矛盾しない"}
    egg_sphere:   # 殻付き卵の温度を一様な球の熱伝導の解で持つ（2026-09-28 夜、Q6 (a)。rules.md §10）。tau_min.shell と tau_white_layer_min は使わなくなった
      R2_over_alpha_min: {value: 60.5, unit: min, rule: R-E08, source: "tatsu2019・egg_thermal", check: 抄録確認, why: "球の解で、20℃の卵を 68℃の湯に入れて中心が 1℃以内に達するのが 28分（tatsu2019）になる R²/α。修正 B で決めた値そのまま。熱拡散率 1.7×10⁻⁷ m²/s（egg_thermal）なら半径 2.5cm"}
      yolk_volume_fraction: {value: 0.34, source: egg_structure, check: 本文確認, why: "卵黄を中心の球、卵白をその外側の層とする（卵黄 30〜33%・卵白 56〜59% から中身に占める卵黄の割合）。卵白の層の温度はこの外側の体積平均"}
      modes: {value: 60, check: 推定, why: "固有関数の展開の項数。刻み 0.1分・空気中（4倍遅い）でも 60 項目は exp(-15) 以下に減衰する"}
      Bi_air: {value: 0.5, since: "2026-09-28 夜（余熱）", source: "wiki_htc・egg_thermal・coimbra2006", check: 推定, alternatives: ["0.25（h=5 W/(m²·K)）", "1.25（h=25）"], why: "空気中（室温に置く・冷蔵庫・オーブン）の殻付き卵の表面の条件（ロバン条件）のビオ数 Bi = hR/k。h=10 W/(m²·K)（空気の自然対流 5〜25、wiki_htc。放射で数 W/(m²·K) 足される。濡れた殻からの蒸発は入れていない）、k=0.5 W/(m·K)（卵白 0.52・卵黄 0.34、egg_thermal／0.4〜0.6、coimbra2006）、R=0.025 m（R²/α=60.5分 と α=1.7×10⁻⁷ m²/s から）。水・蒸気は 表面＝媒体温度のまま（cengel_egg の例題 h=800 で Bi≈40）"}
    air_tau_factor: {value: 4, check: 推定, why: "空気（オーブン・冷蔵庫・室温）は液体・金属より熱が伝わりにくい。2026-09-28 夜（余熱）から殻付き卵には使わない（egg_sphere.Bi_air の表面の条件に置き換え）。ほかの形には使う"}
    pot_cooling_tau_min: {value: 90, unit: min, since: "2026-09-28 夜（余熱）", check: 推定, alternatives: ["45", "180"], why: "操作 off_heat（湯に入れたまま火を止める）で、湯の温度が室温（T0_default）へ下がる時定数。出典なし（湯量・蓋・鍋で大きく変わる）。卵が湯を冷ます効果は入れていない。Exp-15 の重ね合わせには使わない"}
    surface_wet_min:   # 乾いた加熱で表面が沸点に縛られている時間（R-W02）。撹拌し続けると表面は中心と同じ温度とみなす
      pan: {value: 1.0, check: 推定}
      oil: {value: 0.5, check: 推定}
      air: {value: 10.0, check: 推定}
    tau_surface_min: {value: 0.5, check: 推定, why: 表面が乾いてから媒体温度に近づく時定数}
    evaporation_pct_per_min:   # 沸点に達している間、全質量に対して毎分失う水の割合
      thin: {value: 4.0, check: 推定, why: フライパンに広げたもの（炒め玉ねぎ・糖液）}
      pot:  {value: 1.0, check: 推定, why: 鍋・蓋なし}
      lid:  {value: 0.25, check: 推定, why: 蓋あり（炊飯）}

  egg_model: {value: kinetic, since: "2026-09-30（Exp-17。既定を kinetic に切り替えたのも同日、本人決定）", why: "殻付き卵の温度と固まり方の計算。kinetic = 2層の球の差分＋変性の一次反応（Exp-17、sim/egg_kinetic.py）、stage = 一様な球の固有関数の解＋温度のしきい値（Exp-14 の形、比較用に残す）。試せるページ（JS）も同じ値を使う"}
  egg_kinetic:   # Exp-17（experiments/exp-17-egg-kinetics/plan.md）。T は ℃。出典 id は dilorenzo2025
    source: "Di Lorenzo et al. (2025) Periodic cooking of eggs. Communications Engineering 4:5, Table 4（熱物性は Abbasnezhad et al. 2016 Food Sci Nutr 4:42 から）。CC BY-NC-ND 4.0 の論文の数値（事実）の引用"
    yolk:  {k_a: 0.0008, k_b: 0.395, rho_a: -0.0023, rho_b: -0.1386, rho_c: 1037.3, cp: 3120, A: 2.72e50, Ea: 3.443e5, check: 本文確認}
    white: {k_a: 0.0013, k_b: 0.5125, rho_a: -0.0041, rho_b: -0.0115, rho_c: 1043.3, cp: 3800, A: 4.85e60, Ea: 4.185e5, check: 本文確認}
    yolk_volume_fraction: {value: 0.34, source: egg_structure, check: 本文確認, why: "egg_sphere と同じ"}
    nodes: {value: 60, check: 推定, why: "半径方向の分割数。60 と 120 で結果が変わらないことを run.py で確かめる"}
    h_air: {value: 10, unit: "W/(m²·K)", source: wiki_htc, check: 推定, why: "空気の自然対流 5〜25。egg_sphere.Bi_air=0.5 と同じ仮定（h=10）"}
    sub_s: {value: 6, unit: s, check: 推定, why: "後退オイラーの刻み。egg_kinetic.py の既定値（6秒）を rules.yaml に移した（2026-09-30、試せるページと同じ値を使うため）"}
    stage_map:   # 仮。結果を見る前に決めた（plan.md の 3.）
      gel_X: {value: 0.9, check: 仮, why: "場所ごとに X ≥ 0.9 を「固まった」とみなす"}
      stage1_mean: {value: 0.1, check: 仮, why: "層の平均の X ≥ 0.1 で段階1（とろみ・白濁）"}
      stage2_g: {value: 0.5, check: 仮, why: "層の体積の半分以上が固まれば段階2"}
      stage3_g: {value: 0.9, check: 仮, why: "層の体積の9割以上が固まれば段階3（黄身は中心の最高温度 ≥ egg_yolk_s3 も要る）"}
  meat_model: {value: tau, since: "2026-09-30（Exp-18）", why: "肉片（form piece）の中心温度の計算。tau = 一次遅れ（tau_min.piece、今の形）、slab = 厚み方向の1次元の熱伝導（sim/meat_slab.py、experiments/exp-18-more-dishes/plan.md の A）。試せるページ（JS）は tau のまま。既定を切り替えるかは評価を見て本人と決める"}
  meat_slab:   # Exp-18。肉片を板とみなす。T は ℃
    nodes: {value: 40, check: 推定, why: "厚み方向の分割数。40 と 80 で結果が変わらないことを run.py で確かめる"}
    sub_s: {value: 6, unit: s, check: 推定, why: "後退オイラーの刻み（Exp-17 の卵と同じ）"}
    thickness_mm: {value: 20, check: 推定, why: "厚さを書いていない肉片の厚さ。tau_min.piece の「厚さ2cm程度の肉片」と同じ"}
    h_contact: {value: 300, unit: "W/(m²·K)", source: ngadi2007, check: 本文確認, alternatives: ["150", "600"], why: "フライパンに触れた面から鍋へ。牛ひき肉のパティ 20mm、180・200℃で表面近くの温度に合うよう決めた値（論文は h 一定と置いた）"}
    h_top: {value: 60, unit: "W/(m²·K)", source: ngadi2007, check: 本文確認, alternatives: ["10（空気の自然対流、wiki_htc）"], why: "フライパンで焼いている間の上の面から室温へ。同じ論文の上面の値"}
