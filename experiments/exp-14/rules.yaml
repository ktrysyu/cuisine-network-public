# ---------------------------------------------------------------
# 料理の判定条件（2026-09-27 追加）
# targets（§6）を「状態の条件の組み合わせ（範囲・段階・真偽）」に変換したもの。
# 判定は満たした条件の割合（重み付けしない）。required: true の条件（食材）は別扱いで、
# 満たさない料理は満たす料理より下に並べる。
# 2026-09-27 から required を満たさない料理は候補から外す（該当なし の判定は候補の中の1位）。
# 2026-09-28 から、食材・殻付きに加えて「それを外したらその料理ではない」定義上の条件も required にした（def: 定義）。理由は rules.md §10
# 「約X」は幅を持たせて範囲にした（幅は推定。各条件の basis に書いた）。
# 条件の書き方:
#   {ingredients: [a, [b, c]]}         a を含み、b か c のどちらかを含む
#   {var: v, range: [lo, hi]}          lo ≦ v ≦ hi（null は片側なし）
#   {var: v, in: [..]}                 段階・カテゴリがどれかに一致
#   {var: v, is: true}                 真偽
#   {history: core, at_or_above: T, min_minutes: m}   中心が T℃以上だった時間の合計が m 分以上
# ---------------------------------------------------------------
dish_conditions:
  scrambled_eggs:
    ja: スクランブルエッグ
    conditions:
      - {ingredients: [egg_whole], required: true, basis: §6 食材}
      - {var: T_core_max, range: [70, 75], basis: "R-E07・omelet_web（C2）"}
      - {var: egg_gel_stage, in: [1, 2], basis: R-E07}
      - {var: gel_structure, in: [小片（カード）], required: true, def: 定義（2026-09-28）, basis: "R-E20（推定）"}
      - {var: egg_white_stage, in: [2], basis: R-E02}
      - {var: egg_yolk_stage, in: [1, 2], basis: R-E05}
      - {var: water, range: [70, 80], basis: "約75（推定）を ±5"}
      - {var: fat_phase, in: [液体（融解）], basis: R-D05}
      - {var: maillard, in: [0], basis: "料理の定義（C9）"}
      - {var: porosity, in: [0], basis: 推定}
  omelet:
    ja: オムレツ（プレーン）
    conditions:
      - {ingredients: [egg_whole], required: true, basis: §6 食材}
      - {var: T_core_max, range: [70, 73], basis: "推定（R-E07）。内側の温度"}
      - {var: egg_gel_stage, in: [1, 2], basis: "推定。内側"}
      - {var: egg_gel_stage_surface, in: [2, 3], basis: "推定。外側"}
      - {var: gel_structure, in: [外側連続・内側半流動], required: true, def: 定義（2026-09-28）, basis: "料理の定義／R-E20（推定）"}
      - {var: maillard, in: [0, 1], basis: 料理の定義}
      - {var: fat_phase, in: [液体（融解）], basis: R-D05}
  custard_pudding:
    ja: プリン
    conditions:
      - {ingredients: [[egg_whole, egg_yolk], milk, sugar], required: true, basis: §6 食材}
      - {var: sugar_conc, range: [5, 15], basis: "約10%（推定）を ±5。乳糖を含む"}
      - {var: T_core_max, range: [80, 85], basis: R-E09}
      - {var: egg_gel_stage, in: [2], basis: R-E09}
      - {var: gel_structure, in: [連続ゲル], required: true, def: 定義（2026-09-28）, basis: "R-E20（推定）"}
      - {var: porosity, in: [0], basis: R-E15}
      - {var: milk_whey_denatured, in: [1], basis: "R-D02（推定）"}
      - {var: maillard, in: [0], basis: R-M02}
      - {var: T_serve, range: [null, 10], basis: "冷蔵温度 約5℃（推定）。10℃以下"}
  chawanmushi:
    ja: 茶碗蒸し
    conditions:
      - {ingredients: [egg_whole, dashi], required: true, basis: §6 食材}
      - {var: egg_dilution, range: [20, 30], required: true, def: 定義（2026-09-28）, basis: "約25%（R-E16）を ±5"}
      - {var: salt_conc, range: [0.5, 1.0], basis: 推定}
      - {var: T_core_max, range: [80, 89.9], basis: "80℃台（推定）"}
      - {var: egg_gel_stage, in: [2], basis: R-E16}
      - {var: gel_structure, in: [連続ゲル], required: true, def: 定義（2026-09-28）, basis: "R-E20（推定）"}
      - {var: porosity, in: [0], basis: R-E15}
      - {var: maillard, in: [0], basis: R-M02}
      - {var: T_serve, range: [60, 70], basis: 推定}
  white_sauce:
    ja: ホワイトソース
    conditions:
      - {ingredients: [butter, flour, milk], required: true, basis: §6 食材}
      - {var: T_core_max, range: [95, 100], basis: "約100℃（R-S10・R-W01）"}
      - {var: starch_gel, range: [0.9, 1.0], required: true, def: 定義（2026-09-28）, basis: "R-S01・R-S10"}
      - {var: gluten, in: [0, 1], basis: 推定}
      - {var: fat_phase, in: [液体（融解）], basis: mcgee 第11章}
      - {var: maillard, in: [0], required: true, def: 定義（2026-09-28）, basis: "料理の定義（ホワイトルー）・R-S09"}
      - {var: milk_casein, in: [分散], basis: R-D01}
  caramel_sauce:
    ja: カラメル
    conditions:
      - {ingredients: [sugar], required: true, basis: §6 食材}
      - {var: T_core_max, range: [160, 179.9], basis: "R-C01・R-C05・R-C06。焦げ（180℃）の手前まで"}
      - {var: syrup_stage, in: [8], basis: R-C05}
      - {var: caramel, in: [2], required: true, def: 定義（2026-09-28）, basis: R-C01}
  sauteed_onion:
    ja: 炒め玉ねぎ（あめ色）
    conditions:
      - {ingredients: [onion], required: true, basis: §6 食材}
      - {var: water, range: [null, 80], basis: "大きく減る（R-O01）。生 90.1 から 10 以上減る（推定）"}
      - {var: mass_ratio, range: [0.2, 0.4], basis: R-O01}
      - {var: onion_sulfur, in: [0], basis: R-O01}
      - {var: sugar_conc_ratio, range: [1.0, null], basis: "重量あたりは上がる（R-O01・R-O02）"}
      - {var: maillard, in: [2, 3], required: true, def: 定義（2026-09-28）, basis: "R-O01・R-O03"}
      - {var: caramel, in: [1, 2], basis: "R-O03（C7）"}
      - {var: cell_wall, in: [崩壊（煮崩れ）], basis: "推定（R-S12 を類推）"}
      - {var: T_surface_max, range: [100.1, null], basis: R-W02}
  steamed_rice:
    ja: ご飯（白飯）
    conditions:
      - {ingredients: [rice, water], required: true, basis: §6 食材}
      - {var: water, range: [60, 65], basis: R-S05}
      - {var: starch_gel, range: [0.9, 1.0], required: true, def: 定義（2026-09-28）, basis: "約0.95（R-S07）"}
      - {var: T_core_max, range: [98, 100], basis: R-S04}
      - {history: core, at_or_above: 98, min_minutes: 20, basis: "R-S04（98℃以上で約20分）"}
      - {var: starch_retro, in: [0], basis: R-S08}
      - {var: maillard, in: [0], basis: R-M02}
      - {var: mass_ratio, range: [2.1, 2.3], basis: R-S05}
  pancake:
    ja: パンケーキ
    conditions:
      - {ingredients: [flour, [egg_whole, egg_yolk], milk, baking_powder], required: true, basis: §6 食材}
      - {var: gluten, in: [1], basis: "R-G02・R-G04"}
      - {var: co2, in: [2], basis: R-L01}
      - {var: starch_gel, range: [0.9, 1.0], required: true, def: 定義（2026-09-28）, basis: 推定}
      - {var: egg_gel_stage, in: [3], basis: 推定}
      - {var: maillard, in: [2], basis: "R-M01・R-L03"}
