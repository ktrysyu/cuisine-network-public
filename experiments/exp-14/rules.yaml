      protein: {k: [9.0535e-2, 4.1486e-4, -4.8467e-7], rho: [8.3599e+1, -1.7979e-2], cp: [4.7442e-1, 1.6661e-4, -9.6784e-8]}
      fat:     {k: [1.3273e-1, -8.8405e-4, -3.1652e-8], rho: [5.8246e+1, -1.4482e-2], cp: [4.6730e-1, 2.1815e-4, -3.5391e-7]}
      carb:    {k: [1.0133e-1, 4.9478e-4, -7.7238e-7], rho: [1.0017e+2, -1.0767e-2], cp: [3.6114e-1, 2.8843e-4, -4.3788e-7]}
