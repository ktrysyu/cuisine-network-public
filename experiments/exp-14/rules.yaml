# Exp-14 調理の計算: 食品科学の規則表（機械可読版）
# 人が読む版は rules.md。表の中身はこのファイルが正本。
# 知覚の層（硬さ・とろみ・甘さ など）への対応はここには書かない（本人が決める部分）。
# perception_candidates は「どの状態変数が効きそうか」の候補だけ。

meta:
  version: 0.1
  created: 2026-09-27
  scope: 物理・化学の状態（段1）と、操作による状態の変化の規則。シミュレータは sim/（採用値は下の sim、判定条件は dish_conditions）。
  check_levels:
    本文確認: 出典の本文（ページ・データベース）を取得し、数値をその場で確認した
    抄録確認: 論文の抄録を取得して確認した（本文は未読）
    抜粋のみ: 検索エンジンの抜粋でのみ確認した（ページ本文は取得できなかった／しなかった）
    書籍(章): 書籍の内容として知っている範囲。ページまでは確かでない。数値は今回ウェブで確認していない
    未確認: 出典を確認できていない。値は推定
  confidence:
    高: 一次に近い出典（論文・公的機関・データベース）で本文か抄録を確認、または複数出典で値が整合
    中: 抜粋のみ、または出典どうしで値に幅・食い違いがある
    低: 出典が弱い（レシピサイト、出典記載のないブログ）か、推定

