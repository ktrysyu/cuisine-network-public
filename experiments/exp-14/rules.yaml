# ---------------------------------------------------------------
# 食材
# canonical は data/labels/taste_scores.csv の canonical 列（味の層とつなぐ鍵）。null は taste_scores に無い
# composition は g/100g（成分表 八訂、本文確認）。salt は食塩相当量
# ---------------------------------------------------------------
ingredients:
  egg_white:
    ja: 卵白
    canonical: egg whites
    fooddb: "12014 卵白/生"
    composition: {water: 88.3, protein: 10.1, fat: Tr, carb: 0.5, salt: null}
    why: プリン・茶碗蒸し・オムレツ等の凝固、メレンゲ系の泡。卵黄と凝固温度が違うので分けて持つ
  egg_yolk:
    ja: 卵黄
    canonical: egg yolks
    fooddb: "12010 卵黄/生"
    composition: {water: 49.6, protein: 16.5, fat: 34.3, carb: 0.2, salt: null}
    why: とろみ（65℃）と凝固（70℃）。脂質を含み泡立ちを妨げる
  egg_whole:
    ja: 全卵（卵白＋卵黄の混合として扱う）
    canonical: eggs
    fooddb: "12004 全卵/生"
    composition: {water: 75.0, protein: 12.2, fat: 10.2, carb: 0.4, salt: null}
    why: 多くの目標料理は全卵。卵白:卵黄の質量比は未確認（推定 約2:1）。計算では egg_white と egg_yolk の混合として展開する
  milk:
    ja: 牛乳
    canonical: milk
    fooddb: "13003 普通牛乳"
    composition: {water: 87.4, protein: 3.3, fat: 3.8, carb: 4.8, salt: 0.1}
    why: プリン・ホワイトソース・スクランブルエッグ・パンケーキ・牛乳ゼリー。卵を薄めて凝固温度を上げる
  heavy_cream:
    ja: 生クリーム（乳脂肪）
    canonical: heavy cream
    fooddb: "13014 クリーム/乳脂肪"
    composition: {water: 48.2, protein: 1.9, fat: 43.0, carb: 6.5, salt: 0.1}
    why: ホイップクリーム（乳脂肪30%以上で泡立つ）
  butter:
    ja: バター（有塩）
    canonical: butter
    fooddb: "14017 有塩バター（食塩不使用は 14018: 水分15.8 脂質83.0）"
    composition: {water: 16.2, protein: 0.6, fat: 81.0, carb: 0.2, salt: 1.9}
    why: ホワイトソースのルー、卵料理の油脂。融け方が温度で変わる
  flour:
    ja: 小麦粉（薄力粉1等）
    canonical: flour
    fooddb: "01015 薄力粉/1等（強力粉1等 01020 は たんぱく質11.8）"
    composition: {water: 14.0, protein: 8.3, fat: 1.5, carb: 75.8, salt: 0}
    why: ホワイトソース（でんぷんの糊化）、パンケーキ（グルテン・糊化）
  rice:
    ja: 米（精白米うるち米）
    canonical: rice
    fooddb: "01083 精白米/うるち米（めし 01088 は水分60.0）"
    composition: {water: 14.9, protein: 6.1, fat: 0.9, carb: 77.6, salt: 0}
    why: ご飯（浸漬・糊化・老化）
  sugar:
    ja: 砂糖（上白糖。グラニュー糖 03005 は炭水化物100.0）
    canonical: sugar
    fooddb: "03003 上白糖"
    composition: {water: 0.7, protein: 0, fat: 0, carb: 99.3, salt: 0}
    why: カラメル、プリン（凝固温度を上げる）、泡の安定
  salt:
    ja: 食塩
    canonical: salt
    fooddb: "17012 食塩"
    composition: {water: 0.1, protein: 0, fat: 0, carb: 0, salt: 99.5}
    why: 卵の凝固力・凝固温度を変える（粟津原 1982）、茶碗蒸し・スクランブルエッグの味付け
  water:
    ja: 水
    canonical: water
    fooddb: null
    composition: {water: 100, protein: 0, fat: 0, carb: 0, salt: 0}
    why: ご飯・カラメル（糖液）・ゼラチンの膨潤。加熱媒体としての沸点100℃
  dashi:
    ja: だし（かつお・昆布）
    canonical: null
    fooddb: "17148 かつお・昆布だし"
    composition: {water: 99.2, protein: 0.3, fat: 0, carb: 0.4, salt: 0.1}
    why: 茶碗蒸しの希釈液（卵:だし=1:3）。状態の上では「ほぼ水＋わずかな塩」
  vegetable_oil:
    ja: 植物油（調合油）
    canonical: vegetable oil
    fooddb: "14006 調合油"
    composition: {water: 0, protein: 0, fat: 100.0, carb: 0, salt: 0}
    why: 揚げる・炒めるの加熱媒体（100℃を超えられる）
  onion:
    ja: 玉ねぎ
    canonical: onions
    fooddb: "06153 たまねぎ/りん茎/生"
    composition: {water: 90.1, protein: 1.0, fat: 0.1, carb: 8.4, salt: 0}
    why: 炒め玉ねぎ（水分蒸発・刺激臭の消失・褐変）
  potato:
    ja: じゃがいも
    canonical: potatoes
    fooddb: "02017 じゃがいも/塊茎/皮なし/生"
    composition: {water: 79.8, protein: 1.8, fat: 0.1, carb: 17.3, salt: 0}
    why: フライドポテト（揚げる）。でんぷん糊化とペクチン（煮崩れ・硬化）の規則を持つ
  tomato:
    ja: トマト
    canonical: tomatoes
    fooddb: "06182 赤色トマト/生"
    composition: {water: 94.0, protein: 0.7, fat: 0.1, carb: 4.7, salt: 0}
    why: 依頼で挙がった食材。今回の目標料理には使わないため、規則は調べていない（成分のみ）
  chicken:
    ja: 鶏むね肉（皮なし）
    canonical: chicken
    fooddb: "11220 若どり/むね/皮なし/生"
    composition: {water: 74.6, protein: 23.3, fat: 1.9, carb: 0.1, salt: 0.1}
    why: 肉たんぱく質の規則（ミオシン・アクチン・コラーゲン）。目標料理は「鶏むねのソテー」
  beef:
    ja: 牛ひき肉
    canonical: ground beef
    fooddb: "11089 うし/ひき肉/生（塊肉は部位で成分差が大きいので未採用）"
    composition: {water: 61.4, protein: 17.1, fat: 21.1, carb: 0.3, salt: 0.2}
    why: 肉の規則を共有。焼く→煮る の順番の違い（非可換性）を試す材料。今回の目標料理には入れていない
  gelatin:
    ja: ゼラチン
    canonical: null
    fooddb: "11198 ぶた/ゼラチン"
    composition: {water: 11.3, protein: 87.6, fat: 0.3, carb: 0, salt: 0.7}
    why: 牛乳ゼリー（冷やすとゲル化、温めると融ける＝可逆）
  vinegar:
    ja: 酢（穀物酢）
    canonical: vinegar
    fooddb: "17015 穀物酢"
    composition: {water: 93.3, protein: 0.1, fat: 0, carb: 2.4, salt: 0}
    why: pH を下げる操作の代表（乳の凝集、卵白泡の安定）
  lemon_juice:
    ja: レモン汁
    canonical: lemon juice
    fooddb: "07156 レモン/果汁/生"
    composition: {water: 90.5, protein: 0.4, fat: 0.2, carb: 8.6, salt: 0}
    why: 酢と同じく pH を下げる。卵白泡の安定に使われる
  baking_powder:
    ja: ベーキングパウダー
    canonical: baking powder
    fooddb: "17084 ベーキングパウダー"
    composition: {water: 4.5, protein: Tr, fat: 1.2, carb: 29.0, salt: 17.3}
    why: パンケーキの膨化（濡れたときと加熱時に CO2）
  yeast:
    ja: パン酵母（乾燥）
    canonical: yeast
    fooddb: "17083 パン酵母/乾燥"
    composition: {water: 8.7, protein: 37.1, fat: 6.8, carb: 43.1, salt: 0.3}
    why: 操作「発酵」を持つため。今回の目標料理（パンケーキはベーキングパウダー）には使わない

# ---------------------------------------------------------------
# 状態変数
# scope: mixture = 鍋の中の混合物全体 / component = 混合物中の成分ごと（卵白・卵黄・でんぷん・肉 …）
# 段階（ordinal）は、出典が温度しきい値でしか語っていないものを連続量にしないため
# ---------------------------------------------------------------
state_variables:
  T_core_max:
    ja: 中心の到達温度
    unit: ℃
    range: [-20, 200]
    type: continuous
    scope: mixture
    note: 凝固・糊化の多くは到達温度で決まるが、それだけでは足りない（t_at_T を参照）
  T_surface_max:
    ja: 表面の到達温度
    unit: ℃
    range: [-20, 250]
    type: continuous
    scope: mixture
    note: 表面が湿っている間は沸点（大気圧で100℃）を超えない（R-W02）。メイラード・カラメル化は表面で起きる
  t_at_T:
    ja: 温度履歴（温度ごとの保持時間）
    unit: "min（温度帯ごと）"
    range: [0, 1440]
    type: history
    scope: mixture
    note: 温泉卵（R-E08）、炊飯（R-S04）、コラーゲン（R-P04）、ショ糖の熱分解（R-C03）は時間に依存する。スカラー1つでは表せない
  water:
    ja: 水分量
    unit: g/100g
    range: [0, 100]
    type: continuous
    scope: mixture
  fat:
    ja: 脂質量
    unit: g/100g
    range: [0, 100]
    type: continuous
    scope: mixture
  protein:
    ja: たんぱく質量
    unit: g/100g
    range: [0, 100]
    type: continuous
    scope: mixture
  T_serve:
    ja: 食べるときの温度
    unit: ℃
    range: [-20, 100]
    type: continuous
    scope: mixture
    note: 調理後の状態ではなく提供条件。§11 の「温度」の層に対応する
  mass_ratio:
    ja: 元の質量に対する比
    unit: "-"
    range: [0, 5]
    type: continuous
    scope: mixture
    note: 炊飯で増え（約2.2倍）、炒め玉ねぎで減る（0.4〜0.2）
  sugar_conc:
    ja: 糖濃度（溶けている糖）
    unit: "g/100g（糖液では %）"
    range: [0, 100]
    type: continuous
    scope: mixture
    note: 炒め玉ねぎでは糖の総量は減るのに重量あたりの濃度は上がりうる（R-O01, R-O02）
  salt_conc:
    ja: 食塩濃度
    unit: g/100g
    range: [0, 30]
    type: continuous
    scope: mixture
  pH:
    ja: pH
    unit: "-"
    range: [2, 9]
    type: continuous
    scope: mixture
  egg_dilution:
    ja: 卵液の卵濃度
    unit: "卵の体積/全体積（%）"
    range: [0, 100]
    type: continuous
    scope: mixture
    note: 茶碗蒸しは約25%（R-E16）。凝固温度を上げる要因
  egg_white_stage:
    ja: 卵白たんぱく質の凝固段階
    type: ordinal
    levels: {0: 生（流動）, 1: とろみ・白濁開始, 2: やわらかい固体, 3: 固いゲル（オボアルブミン凝固）}
    scope: component
  egg_yolk_stage:
    ja: 卵黄の凝固段階
    type: ordinal
    levels: {0: 生（流動）, 1: とろみ, 2: 凝固（しっとり）, 3: ほろほろ・粉状}
    scope: component
  egg_gel_stage:
    ja: 卵液（希釈・混合）全体のゲル段階
    type: ordinal
    levels: {0: 液, 1: とろみ, 2: やわらかいゲル, 3: 固いゲル, 4: 離水・す立ち}
    scope: mixture
    note: 希釈・糖・塩で段階の境目の温度がずれる
  gel_structure:
    ja: ゲルの形
    type: categorical
    levels: [なし, 連続ゲル, 小片（カード）, 外側連続・内側半流動]
    scope: mixture
    note: 撹拌しながら固めたか・静置で固めたかで決まる。スクランブルエッグとオムレツ・プリンの違いはここ
  porosity:
    ja: す（加熱中の気化でできた空洞）
    type: ordinal
    levels: {0: なし, 1: 少し, 2: 多い}
    scope: mixture
  milk_casein:
    ja: カゼインの状態
    type: categorical
    levels: [分散, 凝集（凝乳）]
    scope: component
  milk_whey_denatured:
    ja: 乳清たんぱく質の熱変性
    type: ordinal
    levels: {0: 未変性, 1: 変性}
    scope: component
  fat_phase:
    ja: 脂質の相状態
    type: categorical
    levels: [固体（結晶多い）, 可塑（半固体）, 液体（融解）, O/W乳化（乳・卵黄）, 部分合一ネットワーク（ホイップ）, 分離]
    scope: component
  air_frac:
    ja: 気泡の体積割合（オーバーラン）
    unit: "%（泡立て前体積に対する増加）"
    range: [0, 800]
    type: continuous
    scope: mixture
    note: 値の出典は今回集めていない。目標料理では段階（なし・あり）でしか書いていない
  foam_stage:
    ja: 泡の段階
    type: ordinal
    levels: {0: 泡なし, 1: 粗い泡, 2: やわらかい角, 3: しっかりした角, 4: 泡立てすぎ（分離・バター化・ぼそぼそ）}
    scope: mixture
  starch_gel:
    ja: でんぷんの糊化度
    unit: "0〜1（または %）"
    range: [0, 1]
    type: continuous
    scope: component
    note: 炊飯直後で約95%という測定値がある（R-S07）
  starch_retro:
    ja: でんぷんの老化
    type: ordinal
    levels: {0: なし, 1: 進行, 2: 著しい}
    scope: component
  gluten:
    ja: グルテン形成
    type: ordinal
    levels: {0: なし（乾いた粉）, 1: 形成（水と接触）, 2: 発達（混ぜる・こねる）, 3: 強く発達}
    scope: component
  gluten_relaxed:
    ja: グルテンの緩み（寝かせ）
    type: ordinal
    levels: {0: 張っている, 1: 緩んでいる}
    scope: component
  maillard:
    ja: メイラード反応の進み
    type: ordinal
    levels: {0: なし, 1: 薄い焼き色, 2: きつね色, 3: 濃い褐色}
    scope: mixture（主に表面）
  caramel:
    ja: 糖の熱分解（カラメル化）の進み
    type: ordinal
    levels: {0: なし（無色の糖液・結晶）, 1: 淡い色, 2: 褐色（カラメル）, 3: 焦げ（熱分解）}
    scope: mixture
  syrup_stage:
    ja: 糖液の段階（煮詰め）
    type: ordinal
    levels: {0: 溶液, 1: 糸, 2: ソフトボール, 3: ファームボール, 4: ハードボール, 5: ソフトクラック, 6: ハードクラック, 7: 透明な融液, 8: 褐色の融液}
    scope: mixture
  onion_sulfur:
    ja: 玉ねぎの刺激臭成分（揮発性の硫黄化合物）の残り
    type: ordinal
    levels: {0: ほぼ消失, 1: 減少, 2: 生のまま}
    scope: component
  cell_wall:
    ja: 野菜の細胞壁（ペクチン）の状態
    type: categorical
    levels: [生, 硬化（PME）, 軟化, 崩壊（煮崩れ）]
    scope: component
  meat_myosin:
    ja: ミオシン変性
    type: ordinal
    levels: {0: 未変性, 1: 変性}
    scope: component
  meat_actin:
    ja: アクチン変性
    type: ordinal
    levels: {0: 未変性, 1: 変性}
    scope: component
  meat_collagen:
    ja: コラーゲンの状態
    type: ordinal
    levels: {0: 未変性, 1: 変性・収縮, 2: ゼラチン化（溶解）}
    scope: component
  meat_myoglobin:
    ja: ミオグロビン変性（赤→灰褐色）
    type: ordinal
    levels: {0: 未変性, 1: 変性開始, 2: 変性}
    scope: component
  meat_water_loss:
    ja: 肉からの水分流出
    unit: "% of 生重量"
    range: [0, 50]
    type: continuous
    scope: component
    note: 数値の出典は今回集めていない。60℃で急に出る（R-P02）、鶏むね70℃で乾く（R-P05）の定性のみ
  gelatin_state:
    ja: ゼラチンの状態
    type: categorical
    levels: [乾燥, 膨潤, 溶解（ゾル）, ゲル, 分解（酵素）]
    scope: component
  gelatin_conc:
    ja: ゼラチン濃度
    unit: g/100g
    range: [0, 10]
    type: continuous
    scope: mixture
  co2:
    ja: 生地中の CO2（膨化）
    type: ordinal
    levels: {0: なし, 1: 第1段（濡れて発生）, 2: 第2段（加熱で発生）, 3: 発酵で発生}
    scope: mixture
  yeast_alive:
    ja: 酵母の生死
    type: categorical
    levels: [活性, 休眠, 死滅]
    scope: component

# ---------------------------------------------------------------
# 操作
# 焼く・炒める・蒸す・煮る・揚げるは、すべて「加熱」を媒体（空気・金属＋油・蒸気・水・油）で特殊化したもの
# 媒体が表面の最高温度を決める（湿った表面は沸点で頭打ち: R-W02）
# ---------------------------------------------------------------
operations:
  mix:
    ja: 混ぜる
    params: {strength: "弱（さっくり）/中/強", time: min}
    note: 均一化。小麦粉＋水ではグルテンが形成・発達する（R-G01, R-G02）
  whisk:
    ja: 撹拌・泡立て
    params: {time: min, T_medium: ℃}
    note: 空気を入れる。卵白・生クリームで泡。加熱中の撹拌（スクランブル）もこれ
  knead:
    ja: こねる
    params: {time: min}
    note: グルテン発達。今回の目標料理では使わない（パン用）
  soak:
    ja: 浸す（浸漬）
    params: {T_medium: ℃, time: min}
    note: 米の吸水（R-S06）、ゼラチンの膨潤（R-J01）
  heat:
    ja: 加熱（基本形）
    params: {medium: "空気/金属+油/蒸気/水/油", T_medium: ℃, time: min, stirring: bool, lid: bool}
    note: 以下はこの特殊化
  bake:
    ja: 焼く・炒める
    params: {medium: "金属+油（フライパン）/空気（オーブン）", T_medium: ℃, time: min, stirring: bool}
    note: 表面が乾くと100℃を超え、メイラードが起きうる
  steam:
    ja: 蒸す
    params: {T_medium: "℃（蓋のずらしで 85〜100）", time: min}
    note: 表面・中心とも100℃を超えない。茶碗蒸しは85〜90℃に保つ（R-E15）
  simmer:
    ja: 煮る・茹でる・炊く
    params: {T_medium: "℃（≦100）", time: min, water_ratio: "対食材質量比"}
    note: 表面は沸点を超えない（R-W02）。炊飯は吸水しきって水が無くなるまで
  deep_fry:
    ja: 揚げる
    params: {T_oil: "℃（160〜190）", time: min}
    note: 表面は乾いてクラスト、中心は100℃を超えない（R-F01）
  chill:
    ja: 冷やす
    params: {T_medium: ℃, time: min}
    note: ゼラチンのゲル化、でんぷんの老化、脂肪の結晶化
  rest:
    ja: 寝かせる
    params: {T_medium: ℃, time: min}
    note: グルテンの緩み、ベーキングパウダー第1段の CO2、吸水。温度を上げない時間経過
  ferment:
    ja: 発酵
    params: {T_medium: ℃, time: min}
    note: 酵母による CO2。今回の目標料理では使わない
  poach:
    ja: 卵を割って湯に落とす（ポーチ）
    params: {T_medium: "℃（≦100）", time: min, vinegar_pct: "湯に対する酢の量（%）", salt_pct: "湯に対する塩の量（%）"}
    note: 2026-09-27 追加。煮る（simmer）の特殊化で、割った卵がじかに湯にふれる形（drop）。落とした時点の湯温と酢・塩で卵白のまとまりが決まる（R-E21, R-E22）

# ---------------------------------------------------------------
# 規則
# id の頭文字: E=卵 D=乳 S=でんぷん G=グルテン L=膨化 C=糖 M=メイラード F=揚げ O=玉ねぎ J=ゼラチン P=肉 W=水 A=酸
# values の数値は出典の表記のまま（°F併記のものは両方）
# ---------------------------------------------------------------
rules:
  # ---- 卵 ----
  - id: R-E01
    op: heat
    applies_to: egg_white
    condition: T ≧ 60℃（140°F）
    effect: egg_white_stage 0→1（オボトランスフェリンが固まり始める）
    values: "Ovotransferrin begins setting at 140°F/60°C"
    source: soc_temps
    check: 本文確認
    confidence: 高
    note: オボトランスフェリンは卵白たんぱく質の約12%。検索抜粋では 62℃ という値もあった
  - id: R-E02
    op: heat
    applies_to: egg_white
    condition: T ≧ 63℃ でとろみ、≧ 65℃ でやわらかい固体
    effect: egg_white_stage 1→2
    values: "145°F/63°C -- Egg whites begin to thicken / 150°F/65°C -- Egg whites become a tender solid"
    source: soc_temps
    check: 本文確認
    confidence: 高
    note: 凝固開始の値は出典で 55〜57℃（kajiya、出典記載なし）〜63℃ と幅がある（衝突 C1）
  - id: R-E03
    op: heat
    applies_to: egg_white
    condition: T ≧ 80℃
    effect: egg_white_stage 2→3（オボアルブミンが凝固）
    values: "ovalbumin ... doesn't coagulate until the temperature reaches 80°C（オボアルブミンは卵白の54%）"
    source: [soc_sousvide, soc_temps, mcgee]
    check: 本文確認
    confidence: 高
  - id: R-E04
    op: heat
    applies_to: egg_white
    condition: 61〜84℃
    effect: 卵白たんぱく質全体が凝固する温度範囲
    values: "albumen of eggs coagulate at temperatures ranging from 141.8° to 183.2°F (61° to 84°C)"
    source: soc_sousvide
    check: 本文確認
    confidence: 中
    note: R-E01〜E03 と同じ現象を範囲で言ったもの
  - id: R-E05
    op: heat
    applies_to: egg_yolk
    condition: T ≧ 65℃ でとろみ、≧ 70℃ で凝固
    effect: egg_yolk_stage 0→1→2
    values: "The yolk begins to thicken around 65°C and sets around 70°C（McGee p.85）/ 158°F/70°C -- Egg yolks set"
    source: [soc_sousvide, soc_temps, mcgee]
    check: 本文確認
    confidence: 高
  - id: R-E06
    op: heat
    applies_to: egg_yolk
    condition: 80〜90℃
    effect: egg_yolk_stage 2→3（固ゆで卵のほろほろ）
    values: "Further heating to around 80-90°C produces the crumbly texture typical of hard boiled eggs"
    source: soc_sousvide
    check: 本文確認
    confidence: 中
  - id: R-E07
    op: heat
    applies_to: egg_whole（撹拌した全卵、希釈なし）
    condition: T ≧ 73℃
    effect: egg_gel_stage → 2 以上
    values: "165°F/73°C -- Whole egg sets"
    source: soc_temps
    check: 本文確認
    confidence: 中
    note: 家庭向けサイトでは「溶き卵は70℃で固まり始め、73℃でとろとろ、75℃でしっかり」（omelet_web、抜粋のみ・出典記載なし）。衝突 C2
  - id: R-E08
    op: heat
    applies_to: egg_whole（殻付き、一定温度の湯）
    condition: 湯温 65/68/70℃ で保持
    effect: 同じ到達温度でも保持時間で凝固が進む。70℃では30分で卵白の流動性が消える。65・68℃では卵黄の高さが保持時間とともに増す
    values: "中心が湯温近くに達するまで 65℃:30分、68℃:28分、70℃:27分。70℃では30分で卵白の流動性が消失"
    source: tatsu2019
    check: 抄録確認
    confidence: 高
    note: 状態は到達温度だけでなく温度履歴 t_at_T を持つ必要がある根拠
  - id: R-E09
    op: heat
    applies_to: egg + milk（+ sugar）
    condition: 卵を牛乳で薄める
    effect: 凝固（とろみ開始）温度が上がる。カスタードは 80〜85℃で凝固
    values: "custard (egg, milk, sugar) will coagulate between 80°C and 85°C (176–185°F) / 卵1個+牛乳1カップ+砂糖大さじ1 では 175–180°F まで増粘が始まらない（薄めない卵は約150°F）"
    source: [custard_textbook, custard_123, mcgee]
    check: 抜粋のみ
    confidence: 中
    note: custard_textbook は取得を試みたが 403。値は検索抜粋。McGee 第2章にも同趣旨の記述があるはずだが本文未確認
  - id: R-E10
    op: mix
    applies_to: egg + sugar
    condition: 砂糖を加える
    effect: 凝固温度がさらに上がる。牛乳の効果と足し合わさる
    values: "Sugar raises the coagulation temperature further ... milk and sugar effects are additive"
    source: custard_123
    check: 抜粋のみ
    confidence: 中
    note: 何℃上がるかの数値は見つけていない
  - id: R-E11
    op: heat
    applies_to: egg_white / egg_yolk + sugar
    condition: 砂糖 10〜30% 添加
    effect: ゲル強度が下がる（卵白で最も大きい）
    values: "砂糖添加の影響は卵白で最も大きくゼリー強度が著しく減少した"
    source: awatsu1982
    check: 抄録確認
    confidence: 高
  - id: R-E12
    op: heat
    applies_to: egg_white / egg_yolk + salt
    condition: 食塩 0.5〜2.5% 添加
    effect: 凝固力（ゲル化）が促進される。卵白は 0.5% で著しく、1.0% で最高。卵黄は 1.0% まではあまり変わらず 1.5〜2.0% で著しく促進
    values: 抄録の記述どおり
    source: awatsu1982
    check: 抄録確認
    confidence: 高
  - id: R-E13
    op: heat
    applies_to: egg_white / egg_yolk / egg_whole + salt
    condition: 食塩量を増やす
    effect: 凝固温度は上がる。卵白に 1.5% 以上で著しく上がる
    values: "凝固温度は卵白,卵黄,全卵共食塩量の増加と共に上昇し,特に卵白に食塩1.5%以上添加した場合には著しく上昇した"
    source: awatsu1982
    check: 抄録確認
    confidence: 高
    note: R-E12（凝固力は上がる）と向きが逆に見える。同じ論文の中で「凝固力」と「凝固温度」は別の指標。衝突 C5
  - id: R-E14
    op: mix
    applies_to: egg_white + acid
    condition: pH を下げる
    effect: 卵白の凝固が促進される（ポーチドエッグに酢を入れる理由）
    values: null
    source: mcgee
    check: 未確認
    confidence: 低
    note: 書籍第2章の内容として知っている範囲。数値なし。推定
  - id: R-E15
    op: steam
    applies_to: 希釈卵液（茶碗蒸し・プリン）
    condition: 蒸し器内を 85〜90℃ に保ち沸騰させない
    effect: porosity（す）を抑える。高すぎると す立ち・硬くなる
    values: "蒸し器内の温度を85～90℃に保ち、卵液の沸騰を防ぐことによって、“す”の発生を最小限に抑える"
    source: chawan_web
    check: 抜粋のみ
    confidence: 中
    note: 仕組み（卵液中の水の気化で空洞ができる）は複数の家庭向けサイトで一致。論文での確認はしていない
  - id: R-E16
    op: mix
    applies_to: egg_whole + dashi
    condition: 卵:だし = 1:3（体積）
    effect: egg_dilution 約25%。やわらかく固まる
    values: "卵とだし汁の容量の黄金比は「1：3」／卵液の体積濃度を約25%"
    source: chawan_web
    check: 抜粋のみ
    confidence: 中
  - id: R-E17
    op: steam
    applies_to: カスタードプリン・茶碗蒸し
    condition: 85℃ 36分 または 90℃ 12分
    effect: egg_gel_stage → 2
    values: "85℃で36分蒸し上げる／90℃で12分蒸し上げる"
    source: kajiya
    check: 本文確認
    confidence: 低
    note: ページに出典の記載がない。温度と時間の組の例として残す
  - id: R-E18
    op: whisk
    applies_to: egg_white
    condition: 砂糖・酸・脂肪の有無
    effect: 砂糖は泡立て時間を延ばすが泡を安定させる。酸（酒石酸など）は pH を下げて安定させる。脂肪（卵黄を含む）は泡立ちを妨げる
    values: "even 0.5 wt% egg yolk will destroy the foaming characteristics of egg protein system"
    source: [eggfoam_isu, eggfoam_yolk]
    check: 抜粋のみ
    confidence: 中
  - id: R-E19
    op: heat
    applies_to: 撹拌が不十分な全卵
    condition: 卵白と卵黄が分かれたまま加熱
    effect: 凝固温度が違うので固まり方にむらが出る
    values: "卵の凝固温度は黄身と白身で異なり、しっかり混ぜなければ固まり方にムラが出来ます"
    source: omelet_web
    check: 抜粋のみ
    confidence: 中
    note: R-E01〜E05 から導ける帰結
  - id: R-E20
    op: heat
    applies_to: 卵液
    condition: 加熱中に撹拌し続ける（stirring=true）／撹拌しない
    effect: 撹拌あり → gel_structure=小片（カード）。撹拌なし → 連続ゲル
    values: null
    source: null
    check: 未確認
    confidence: 低
    note: 推定。スクランブルエッグとオムレツ・プリンの違いを状態で書くために置いた。出典を探していない

  # ---- 卵を割って湯に落とす（ポーチドエッグ、2026-09-27 追加）----
  - id: R-E21
    op: poach
    applies_to: egg_whole（割った卵、溶いていない）
    condition: 湯温 80〜85℃（鍋底から小さな泡、沸騰させない）に割り入れる
    effect: 卵白が散る前に固まり、卵黄を包んでまとまる（egg_white_cohesion=まとまる）。沸騰（100℃）では対流で卵白がちぎれる（ばらける）。70℃では卵白が固まりきらない。3〜4分で卵白は完全に固まり、卵黄の中心は 65℃未満（流動）
    values: "Bring to a temperature of 80–85°C — small bubbles forming at the base ... but no rolling simmer. At 100°C, the turbulence tears the white apart before it sets. At 70°C, the white never fully coagulates. / The cooking time (3–4 minutes) is chosen to bring the white to full coagulation while keeping the center of the yolk below 65°C（terumimorita）／「沸騰させると水の対流が生じ白身が崩れてしまう」「85度を目安に…五分間」（travelingfoodlab）／The egg is cooked at 80C for 4 minutes（soc_poach）"
    source: [terumimorita, travelingfoodlab, soc_poach]
    check: 本文確認
    confidence: 低
    note: 料理人の記事とレシピの記述で、論文では確認していない。湯温は出典によって 62℃〜沸騰までばらつく（C13）
  - id: R-E22
    op: poach
    applies_to: egg_white（湯に酢・塩を加える）
    condition: "湯に酢・塩を加える（例: ワインビネガー湯量の3%、穀物酢・米酢なら4.5%）"
    effect: 卵白の凝固が速まり、湯の中で飛び散らない。ただし卵の表面に不規則な膜・ちぎれができる（egg_white_cohesion=まとまる（表面に膜・ちぎれ））
    values: "adding vinegar and salt \"does speed coagulation, but also produces shreds and an irregular film over the egg surface\"（McGee、soc_poach の引用）／〈酢や塩を加えることで早く固まるが卵の表面に不規則な膜が生じる〉（『マギーキッチンサイエンス』p88、travelingfoodlab の引用）／「酢は卵白を固める働きをするので、酢が入った湯に卵を入れるとすばやく卵白が固まり、湯の中で飛び散ることがない」（kyounoryouri）"
    source: [soc_poach, travelingfoodlab, kyounoryouri, mcgee]
    check: 本文確認
    confidence: 中
    note: McGee の本文は開いておらず、2つのページの引用で確認した（英語版・日本語版で一致）。何℃・何分速まるかの数値はない。kyounoryouri は沸騰した湯＋酢で作る。R-E14（未確認）の内容をこの出典で確かめた形
  - id: R-E23
    op: heat
    applies_to: egg_white（オボアルブミン）
    condition: pH を下げる（pH 5〜9 の範囲で比較）
    effect: オボアルブミンの熱安定性が下がる（pH が高いほど安定）。水中 5% で変性温度 80.22℃
    values: "The Td of OVA and LYZ in water (5% w/v, 5 °C/min) were 80.22 °C and 77.46 °C ... OVA thermal stability was improved with increasing pH"
    source: wang2025
    check: 抄録確認
    confidence: 高
    note: 精製たんぱく質の溶液での測定。pH ごとの変性温度の数値は抄録に無いので、段階のしきい値は動かさない

  # ---- 乳 ----
  - id: R-D01
    op: mix
    applies_to: milk + acid（vinegar / lemon_juice）
    condition: pH ≦ 4.6
    effect: milk_casein 分散→凝集（カゼインの等電点）
    values: "At pH 4.6, which is the isoelectric point of casein, the casein micelles disintegrate and precipitate"
    source: casein
    check: 抜粋のみ
    confidence: 高
    note: 教科書的な値で、抜粋した複数の出典で一致
  - id: R-D02
    op: heat
    applies_to: milk
    condition: 加熱
    effect: 乳清たんぱく質は熱で変性する。カゼインは熱に強い（変性は約120℃から）
    values: "casein ... denaturation begins at approximately 120°C, while whey proteins ... can be denatured at high temperatures"
    source: casein
    check: 抜粋のみ
    confidence: 中
    note: 乳清の変性温度の数値は確認していない（推定 70℃前後）
  - id: R-D03
    op: whisk
    applies_to: heavy_cream
    condition: 乳脂肪 30% 以上、品温 7.5〜12.5℃
    effect: 脂肪球が部分合一してネットワークを作り気泡を安定させる（fat_phase → 部分合一ネットワーク、foam_stage ↑）
    values: "Whipping cream traditionally has a fat content between 30 and 40% / temperature range of 7.5 to 12.5°C recommended（5〜15℃で比較）/ whipping time, overrun, and bubble diameters decreased with increasing temperature"
    source: [cream2010, cream_overview]
    check: 抜粋のみ
    confidence: 中
  - id: R-D04
    op: whisk
    applies_to: heavy_cream
    condition: 泡立てすぎ
    effect: fat_phase → 分離（バターと液に分かれる）。foam_stage=4
    values: null
    source: mcgee
    check: 書籍(章)
    confidence: 中
    note: 第1章（乳）の内容。何分でそうなるかの数値はない
  - id: R-D05
    op: heat
    applies_to: butter
    condition: 約32〜35℃
    effect: fat_phase 可塑→液体。明確な融点はなく幅で融ける
    values: "butter melts ... typically around 32-35°C / 融け始めは 21〜40℃の間 / 冷蔵では2/3以上の脂肪が固体"
    source: butter
    check: 抜粋のみ
    confidence: 中
  - id: R-D06
    op: heat
    applies_to: 乳脂肪
    condition: "-40〜40℃"
    effect: 乳脂肪の融解範囲
    values: "Milk fat has a wide melting range, which spans from about −40 to 40°C"
    source: butter
    check: 抜粋のみ
    confidence: 中

  # ---- でんぷん ----
  - id: R-S01
    op: heat
    applies_to: flour（小麦でんぷん）+ 水
    condition: 約 52〜66℃
    effect: starch_gel 0→1（糊化）
    values: "Wheat: 59.5-64°C or 52-66°C / peak 61.5°C"
    source: starch_gel
    check: 抜粋のみ
    confidence: 中
    note: 水分量と測定法で値が変わる
  - id: R-S02
    op: heat
    applies_to: rice（米でんぷん）+ 水
    condition: 約 58.9〜82℃（出典で幅）
    effect: starch_gel 0→1
