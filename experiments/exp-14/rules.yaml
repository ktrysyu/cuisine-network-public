    state:
      T_core_max: {value: "内側 70〜73℃ 前後、外側はそれ以上", basis: "推定（R-E07）"}
      egg_gel_stage: {value: "外側 2〜3、内側 1〜2", basis: 推定}
      gel_structure: {value: 外側連続・内側半流動, basis: "料理の定義／R-E20（推定）"}
      maillard: {value: "0〜1", basis: "料理の定義（焼き色は付けないのが仏式の基本とされるが未確認）"}
      fat_phase: {value: 液体（バター融解）, basis: R-D05}
