[project]
name = "cuisine-network"
version = "0.1.0"
description = "Cuisine Network research experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gensim>=4.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
